name: Store checks
on:
  # Manual until this account's GitHub Actions billing lock is resolved.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - name: PHP syntax
        run: php -l php/bootstrap.php
      - name: Password configuration
        run: node tests/admin-password-config.test.mjs
      - name: PHP password verification
        run: node tests/php-admin-password.test.mjs
      - name: Admin sign-in
        run: node tests/admin-login.test.mjs
      - name: Storefront regressions
        run: node tests/storefront-regressions.mjs
      - name: Cart stock limits
        run: node tests/cart-stock.test.mjs
      - name: CSV collection
        run: node tests/azmat-import.test.mjs
      - name: PHP store compatibility
        run: node tests/php-smoke.mjs
